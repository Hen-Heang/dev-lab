spring:
  application:
    name: heang-api-center
  datasource:
     driver-class-name: org.postgresql.Driver
     url: jdbc:postgresql://localhost:5432/hac_db
     username: postgres
     password: 123

server:
  port: 8080

jpa:
   hibernate:
     ddl-auto: update
   show-sql: true
   properties:
     hibernate:
         format_sql: true

logging:
  level:
    com.henheang.heangapicenter: debug