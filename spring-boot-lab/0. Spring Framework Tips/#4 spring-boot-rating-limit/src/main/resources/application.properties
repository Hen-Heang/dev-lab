# ----- Rate limit demo -----
# Plan for the caller: GOLD = 5 req/min, anything else = 2 req/min.
# Change this and restart to see the limit change.
user.type=GOLD

# ----- H2 in-memory database -----
spring.datasource.url=jdbc:h2:mem:postsdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# View the data while the app runs: http://localhost:8080/h2-console
# JDBC URL in the console login: jdbc:h2:mem:postsdb

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
